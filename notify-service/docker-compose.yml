services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notify
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  server:
    build: .
    command: ["/bin/server"]
    environment:
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
      REDIS_ADDR: redis:6379
      SERVER_PORT: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["/bin/worker"]
    environment:
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
      REDIS_ADDR: redis:6379
      WORKER_COUNT: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
